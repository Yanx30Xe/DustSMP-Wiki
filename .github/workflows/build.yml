name: Build plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unzip and build every plugin zip in the repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -q -o "$z"; done
          for pom in */pom.xml; do mvn -B -f "$pom" package; done

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: '*/target/*.jar'
